name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Core tests
        run: swift test --package-path CopyCore
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Copy.xcodeproj -scheme Copy -configuration Debug CODE_SIGNING_ALLOWED=NO build
