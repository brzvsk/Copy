name: Copy
options:
  bundleIdPrefix: sk.brzv
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  CopyCore:
    path: CopyCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Copy:
    type: application
    platform: macOS
    sources:
      - Copy
      - Copy/Assets.xcassets
    dependencies:
      - package: CopyCore
      - package: KeyboardShortcuts
      - package: Sparkle
    scheme:
      testTargets: []
    info:
      path: Copy/Info.plist
      properties:
        CFBundleDisplayName: Copy
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "8"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Original © 2026 Tarik Caramanico; modifications © 2026 Nikolai Berezovskii - GPL-3.0"
        # Sparkle auto-update feed. SUPublicEDKey is this fork's dedicated EdDSA
        # public key (generated under the `brzv-copy` keychain account; the private
        # key is backed up outside the repo, see Scripts/sparkle-keys-README.md).
        SUFeedURL: https://brzvsk.github.io/Copy/appcast.xml
        SUPublicEDKey: "ic1GeI8aVeYsA3RsX9sxrbaAkWOFyLOhL8K94U7TrNA="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Declares the internal card-drag payload type (see ShelfViewModel.UTType.copyItem)
        # so the system recognizes it during real drag-and-drop, not just as an in-process
        # string constant. Required for card → pinboard tab filing to work.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: sk.brzv.copy.item
            UTTypeDescription: Copy clipboard item
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sk.brzv.Copy
        MARKETING_VERSION: "0.2.0"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UDTBP44Q7F
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
